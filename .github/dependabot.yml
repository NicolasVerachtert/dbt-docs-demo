version: 2
updates:
  # dbt v1 toolchain (uv.lock). dbt-core is constrained to ~=1.11.0 in
  # pyproject.toml, so this proposes 1.11 patches, not 1.12.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/environments/pro
      - /terraform/modules/dbt_docs
    schedule:
      interval: monthly
