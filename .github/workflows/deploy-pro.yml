name: Deploy to PRO

on:
  push:
    branches:
      - main
    paths:
      - "jaffle_shop/**"
      - "web/**"
      - "terraform/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Queue deploys instead of cancelling: an interrupted terraform apply leaves the
# state locked.
concurrency:
  group: deploy-pro
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: pro
