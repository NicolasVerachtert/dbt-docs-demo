name: build-v2

# Reusable: dbt v2 (Fusion engine) -> dbt Docs v2, a single-page app reading
# Parquet files, with column-level lineage. Uploaded as the site-v2 artifact.
on:
  workflow_call:

env:
  # The full (free) dbt distribution. dbt-oss would also work, but it has no
  # static analysis engine, so no column-level lineage.
  # Dependabot doesn't track this pin; bump it by hand.
  DBT_VERSION: "2.0.8"
  DO_NOT_TRACK: "1" # no anonymous usage stats from the CLI or the published site

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaffle_shop
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # v2 is a compiled binary. The PyPI package downloads it from dbt Labs' CDN;
      # the DuckDB driver is downloaded on first run the same way.
      - name: Install dbt v2
        run: |
          uv tool install "dbt==${DBT_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: dbt version
        run: dbt --version

      # --static-analysis strict makes dbt parse the SQL itself, which is what
      # produces column-level lineage. --write-index writes the Parquet metadata
      # the docs site reads.
      - name: dbt build
        run: dbt build --write-index --static-analysis strict

      # --no-compile reuses the index from the build step instead of recompiling
      # without static analysis (which would drop the lineage).
      - name: dbt docs generate
        run: dbt docs generate --no-compile --output-dir ../_site

      - name: Assemble site
        run: cp ../web/staticwebapp.config.json ../_site/

      - uses: actions/upload-artifact@v7
        with:
          name: site-v2
          path: _site
          retention-days: 7
