[project]
name = "jaffle-docs-azure"
version = "0.1.0"
description = "jaffle_shop docs built with dbt v1 and v2, hosted on Azure Static Web Apps"
requires-python = ">=3.12,<3.14"
# The dbt v1 toolchain. dbt-core is held at 1.11 because that's the version
# dbt-fabric (Microsoft's Fabric Data Warehouse adapter) is built and tested against.
# dbt v2 is a separate binary and is not managed here (see README).
dependencies = [
    "dbt-core~=1.11.0",
    "dbt-duckdb~=1.11.0",
]

[tool.uv]
package = false
